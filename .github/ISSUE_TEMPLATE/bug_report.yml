name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not use this form to report a security vulnerability** - see [SECURITY.md](https://github.com/midnight-security/midnight-homeassistant-panel/blob/main/SECURITY.md) instead.
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.7.3"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Midnight 911 Frontend Plugin version
      description: Shown in the top-right corner of the panel in HA.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: midnight_alerts (backend) version
      description: Settings → Devices & services → Midnight 911 Integration
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      multiple: true
      options:
        - General tab
        - Sensors tab
        - Codes tab
        - Import from Alarmo
        - Installation / setup
        - Other
    validations:
      required: true
  - type: checkboxes
    id: engine-check
    attributes:
      label: Panel vs. engine
      options:
        - label: >-
            I've confirmed this is an issue in the panel itself, not in
            arm/disarm/dispatch behavior (which lives in
            [midnight_alerts](https://github.com/midnight-security/midnight-homeassistant-911)).
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      description: >-
        Enable debug logging for `custom_components.midnight_911_frontend_plugin`
        on the Home Assistant side, and check the browser console (F12) for
        frontend errors.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and this hasn't already been reported.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md if it is).
          required: true
