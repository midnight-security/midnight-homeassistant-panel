on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Get version
        id: version
        uses: home-assistant/actions/helpers/version@master

      - name: Patch manifest and zip
        run: |
          sed -i 's/v0.0.0/${{ steps.version.outputs.version }}/' custom_components/midnight_911_frontend_plugin/manifest.json

          cd custom_components/midnight_911_frontend_plugin/
          zip ../../midnight_911_frontend_plugin.zip ./* frontend/dist/* -x '.*'
      - uses: JasonEtco/upload-to-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ./midnight_911_frontend_plugin.zip application/zip
